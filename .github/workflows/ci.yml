name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Least privilege for the GITHUB_TOKEN; no job needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (tag in the comment).
# Update by resolving the new tag: `git ls-remote https://github.com/<repo> refs/tags/<tag>`.
# Service images: postgres:16.15-alpine pinned by multi-arch index digest
# (same as infra/docker/docker-compose.yml).

jobs:
  api:
    name: API (lint + tests + RLS + migration drift)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: change_me  # ephemeral CI-only database
          POSTGRES_DB: hms_dev
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U hms -d hms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HMS_TEST_PORT: "5433"
      HMS_APP_PASSWORD: change_me
      # libpq (psql + psycopg2) reads PGPASSWORD for roles/DBs whose
      # password is not embedded in a connection URL (superuser "hms").
      PGPASSWORD: change_me
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install API dependencies (hash-locked)
        run: pip install --require-hashes --no-deps -r apps/api/requirements-dev.lock
      - name: Lint (ruff)
        run: ruff check apps/api scripts --select F,E --line-length 100
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Provision roles and databases
        run: ./scripts/setup_local_db.sh
      - name: Run test suite (auth, RBAC, cross-tenant RLS, ops probes)
        working-directory: apps/api
        run: pytest -q
      - name: Migration drift (alembic check — ORM models vs migrations)
        working-directory: apps/api
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg2://hms@127.0.0.1:5433/hms_dev
        run: |
          alembic upgrade head
          alembic check

  dependency-audit:
    name: Dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"
      - name: pip-audit (runtime lock)
        run: pip-audit --strict --disable-pip --no-deps -r apps/api/requirements.lock
      - name: pip-audit (dev/test lock)
        run: pip-audit --strict --disable-pip --no-deps -r apps/api/requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: npm audit (web, production deps, high+)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # scan the full history, not just the tip
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum-verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan git history
        run: /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build

  mobile:
    name: Mobile (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  contracts:
    name: OpenAPI contract snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install API dependencies (hash-locked)
        run: pip install --require-hashes --no-deps -r apps/api/requirements.lock
      - name: Generate OpenAPI into packages/contracts
        # Same script as local development — single source of truth for
        # serialization flags (ensure_ascii=False keeps the snapshot stable).
        run: ./scripts/generate-contracts.sh
      - name: Ensure snapshot is committed
        run: |
          git diff --exit-code packages/contracts/openapi.json \
            || { echo "packages/contracts/openapi.json is stale — regenerate via scripts/generate-contracts.sh"; exit 1; }

  docker:
    name: Docker (lint + build + compose smoke, no push)
    runs-on: ubuntu-latest
    env:
      HADOLINT_VERSION: 2.12.0
      HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
      COMPOSE: docker compose -f infra/docker/docker-compose.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: hadolint (pinned, checksum-verified)
        run: |
          curl -sSfL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum --check --strict
          chmod +x /tmp/hadolint
          /tmp/hadolint infra/docker/api.Dockerfile infra/docker/web.Dockerfile
      - name: Generate throwaway secrets for this run
        run: |
          for v in HMS_PG_PASSWORD HMS_APP_PASSWORD JWT_SECRET; do
            s="$(openssl rand -hex 24)"; echo "::add-mask::$s"; echo "$v=$s" >> "$GITHUB_ENV"
          done
      - name: Build both images (api + web, no push)
        run: $COMPOSE build
      - name: Compose smoke test (migrate job -> api ready -> web proxies to api)
        run: |
          $COMPOSE up -d
          ok=""
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/v1/health/ready >/dev/null \
               && curl -sf http://127.0.0.1:3000/api/v1/health/ready >/dev/null; then ok=1; break; fi
            sleep 3
          done
          $COMPOSE ps -a
          [ -n "$ok" ] || { $COMPOSE logs --no-color; exit 1; }
          test "$(docker inspect -f '{{.State.ExitCode}}' "$($COMPOSE ps -a -q migrate)")" = 0
          test "$(docker inspect -f '{{.Config.User}}' hms-api:local)" = "10001:10001"
          test "$(docker inspect -f '{{.Config.User}}' hms-web:local)" = "node"
          curl -sf http://127.0.0.1:3000/api/v1/health/ready
      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans

  backup-restore-drill:
    name: Backup / restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: change_me  # ephemeral CI-only database
          POSTGRES_DB: hms_dev
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U hms -d hms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGUSER: hms
      PGPASSWORD: change_me
      HMS_APP_PASSWORD: change_me
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install API dependencies (hash-locked runtime + test client)
        run: pip install --require-hashes --no-deps -r apps/api/requirements-dev.lock
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 gnupg
          echo "PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Provision roles
        run: ./scripts/setup_local_db.sh
      - name: Run drill (backup -> tamper/overwrite guards -> restore -> compare)
        run: ./scripts/backup_restore_drill.sh
